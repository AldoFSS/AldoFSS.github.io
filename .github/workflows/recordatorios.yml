name: Procesar recordatorios CaféLiz

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recordatorios-cafeliz
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invocar procesadores protegidos
        env:
          RECORDATORIOS_HMAC_SECRET: ${{ secrets.RECORDATORIOS_HMAC_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          secret = os.environ.get("RECORDATORIOS_HMAC_SECRET", "")
          if len(secret) < 32:
              sys.exit("Falta configurar el secreto RECORDATORIOS_HMAC_SECRET.")

          base_url = "https://cafeliz.nfy.fyi"
          scripts = (
              ("/PHP/procesar_recordatorios_cupon.php", "Recordatorios procesados."),
              ("/PHP/procesar_recordatorios_reserva.php", "Recordatorios procesados."),
          )
          failures = []
          for path, success_marker in scripts:
              timestamp = str(int(time.time()))
              signature = hmac.new(
                  secret.encode(),
                  f"{timestamp}\n{path}".encode(),
                  hashlib.sha256,
              ).hexdigest()
              request = urllib.request.Request(
                  base_url + path,
                  data=b"",
                  method="POST",
                  headers={
                      "X-CafeLiz-Timestamp": timestamp,
                      "X-CafeLiz-Signature": signature,
                      "Content-Type": "application/octet-stream",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      body = response.read(512).decode("utf-8", errors="replace")
                      if (response.status != 200 or response.geturl() != base_url + path
                              or success_marker not in body):
                          failures.append(f"{path}: respuesta inesperada (HTTP {response.status})")
                      else:
                          print(f"{path}: procesador ejecutado (HTTP 200)")
              except urllib.error.HTTPError as error:
                  failures.append(f"{path}: HTTP {error.code}")
              except Exception as error:
                  failures.append(f"{path}: {type(error).__name__}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
